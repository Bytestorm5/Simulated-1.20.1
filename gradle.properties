# Shared Project Settings
# Minecraft 1.20.1 runs on Java 17. The build uses a Java 21 toolchain that compiles with --release 17, because some
# compile-only dependencies ship Java 21 class files.
java_version=17
java_toolchain_version=21

# Mod
mod_version=1.3.2
license=Read attached LICENSE.md

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Parchment Mappings
# https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=47.4.10
forge_version_range=[47.4.0,)
forge_loader_version_range=[47,)
# ModDevGradle (legacy Forge mode)
moddev_version=2.0.147
mixin_version=0.8.5
mixinextras_version=0.5.3

# Dependencies
# Veil 4.3.2 and Sable 2.0.5 ported to Forge 1.20.1 (Bytestorm5/Veil-1.20.1 and Bytestorm5/sable-1.20.1). They aren't
# on a public maven yet: install their jars with scripts/install_local_deps.sh first.
veil_version=4.3.2
sable_version=2.0.5
sable_companion_version=1.6.0

# Create 6.0.8 is the newest 1.20.1 build; Ponder, Flywheel and Registrate match the versions it bundles
create_version=6.0.8-291
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3

# only change when mods.toml should be updated
create_mod_version = 6.0.8
sable_mod_version_range = [2.0.0,3.0.0)
flywheel_mod_version = 1.0.5
jei_version = 15.20.0.135
jei_min_version = 15.2.0.22

# Mod Integration
computercraft_tweaked_version = 1.120.2
natures_compass_version = 1.12.0
explorers_compass_version = 1.4.0
curios_version=5.14.1
embeddium_version=0.3.31+mc1.20.1
oculus_version=1.20.1-1.8.0

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
