plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

evaluationDependsOn(':simulated:neoforge')

def generatedResources = project(":aeronautics:common").file("src/generated/resources")
def commonResources = project(":aeronautics:common").file("src/main/resources")

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    def at = project(':aeronautics:common').file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            // Dev runs load mods from class folders without a jar manifest, so name the mixin configs here
            programArgument("-mixin.config=aeronautics.mixins.json")
            programArgument("-mixin.config=aeronautics.neoforge.mixins.json")
            programArgument("-mixin.config=simulated.mixins.json")
            programArgument("-mixin.config=simulated-neoforge.mixins.json")
            systemProperty('forge.enabledGameTestNamespaces', mod_id)
            ideName = "Aero Forge ${it.name.capitalize()} (${project.path})"
        }

        data {
            data()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--all',
                    '--mod', 'aeronautics',
                    '--output', generatedResources.absolutePath,
                    '--existing', commonResources.absolutePath,
                    '--existing-mod', 'create',
                    '--existing-mod', 'simulated'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        simulated {
            sourceSet project(':simulated:neoforge').sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir generatedResources.absolutePath
}

// Forge 1.20.1 runs on SRG names, so every mixin config needs a refmap. The common sources are compiled in this
// project, so one refmap covers both configs.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "aeronautics.mixins.json"
    config "aeronautics.neoforge.mixins.json"
}

// Forge 1.20.1 only loads mixin configs listed in the jar manifest
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': "aeronautics.mixins.json,aeronautics.neoforge.mixins.json")
}
