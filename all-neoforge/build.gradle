plugins {
    id 'net.neoforged.moddev.legacyforge'
}

def neoforgeProjects = rootProject.subprojects.findAll { it.path.endsWith(":neoforge") }

neoforgeProjects.each { neoforgeProject ->
    evaluationDependsOn(neoforgeProject.path)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    neoforgeProjects.forEach { neoforgeProject ->
        def parentName = neoforgeProject.parent.name
        def commonProject = project(":$parentName:common")
        def at = commonProject.file('src/main/resources/META-INF/accesstransformer.cfg')

        if (at.exists()) {
            accessTransformers.from(at.absolutePath)
        }
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            // Dev runs load mods from class folders without a jar manifest, so name the mixin configs here
            programArgument("-mixin.config=simulated.mixins.json")
            programArgument("-mixin.config=simulated-neoforge.mixins.json")
            programArgument("-mixin.config=aeronautics.mixins.json")
            programArgument("-mixin.config=aeronautics.neoforge.mixins.json")
            programArgument("-mixin.config=offroad.mixins.json")
            programArgument("-mixin.config=offroad.neoforge.mixins.json")
            ideName = "Forge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }

        client {
            client()
            gameDirectory = project.file('runs/client')
        }

        client {
            // Run with -PquickPlay=<world> to load straight into a singleplayer world
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
        }

        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument 'nogui'
        }

        // Simulated's GameTests with all three mods loaded (the stream codec round trip covers Aeronautics and Offroad)
        gameTest {
            type = "gameTestServer"
            gameDirectory = project.file('runs/gametest')
            systemProperty('forge.enabledGameTestNamespaces', 'simulated')
        }
    }

    mods {
        neoforgeProjects.forEach { neoforgeProject ->
            def parentName = neoforgeProject.parent.name
            "$parentName" {
                sourceSet neoforgeProject.sourceSets.main
            }
        }
    }
}

tasks.register("runDataAll") {
    group = "mod development"
    neoforgeProjects.forEach { neoforgeProject -> 
        dependsOn(neoforgeProject.tasks.runData)
    }
}

dependencies {
    neoforgeProjects.forEach {
        def parentName = it.parent.name
        implementation(it) {
            capabilities {
                requireCapability "$group:${parentName}"
            }
        }
    }
}