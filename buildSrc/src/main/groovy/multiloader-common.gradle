plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    // Compiled by a newer JDK (some compile-only dependencies ship Java 21 class files), targeting the Java version
    // that Minecraft 1.20.1 runs on. See the release flag below.
    toolchain.languageVersion = JavaLanguageVersion.of(java_toolchain_version)
    disableAutoTargetJvm()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
}

repositories {
    mavenCentral()

    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Common and loader modules both compile against Forge 1.20.1 (the common code has always used loader classes).
// Mod jars are published with SRG names, so they go through ModDevGradle's remapping configurations.
pluginManager.withPlugin('net.neoforged.moddev.legacyforge') {
    dependencies {
        compileOnly "org.spongepowered:mixin:$mixin_version"
        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:$mixinextras_version"))

        modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
        modImplementation("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
        modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

        modImplementation("foundry.veil:veil-forge-${minecraft_version}:${veil_version}")
        // Bundled inside the Veil jar, but not declared in its metadata
        compileOnly "io.github.ocelot:glsl-processor:0.2.3"
        compileOnly "gg.moonflower:molang-compiler:3.1.1.19"
        compileOnly "io.github.spair:imgui-java-binding:1.92.0"

        modImplementation("dev.ryanhcode.sable:sable-forge-${minecraft_version}:${sable_version}")
        modImplementation("dev.ryanhcode.sable:sable-sable_companion-${minecraft_version}:${sable_companion_version}")

        // Mod compat
        modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
        modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
        modCompileOnly("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}:api")
        modCompileOnly("cc.tweaked:cc-tweaked-$minecraft_version-core-api:$computercraft_tweaked_version")
        modCompileOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge-api:$computercraft_tweaked_version")
        modCompileOnly("maven.modrinth:natures-compass:$minecraft_version-$natures_compass_version-forge")
        modCompileOnly("maven.modrinth:explorers-compass:$minecraft_version-$explorers_compass_version-forge")
        modCompileOnly("maven.modrinth:embeddium:$embeddium_version")
        modCompileOnly("maven.modrinth:oculus:$oculus_version") { transitive = false }
    }
}

['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE.md'))
}

jar {
    from(rootProject.file('LICENSE.md'))

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'forge_version'                : forge_version,
            'forge_version_range'          : forge_version_range,
            'forge_loader_version_range'   : forge_loader_version_range,
            'sable_mod_version_range'            : sable_mod_version_range,
            'create_mod_version'           : create_mod_version,
            'flywheel_mod_version'         : flywheel_mod_version,
            'jei_version'                  : jei_version,
            'jei_min_version'              : jei_min_version,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        mavenLocal()
        maven {
            url = System.getenv('local_maven_url')

            credentials {
                username = System.getenv('local_maven_user')
                password = System.getenv('local_maven_token')
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
