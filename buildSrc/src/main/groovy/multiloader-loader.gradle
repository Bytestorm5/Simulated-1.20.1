plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    def commonProjectPath = project.path.contains(':') ? ":${project.parent.name}:common" : ':common'
    
    compileOnly(project(commonProjectPath)) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: commonProjectPath, configuration: 'commonJava')
    commonResources project(path: commonProjectPath, configuration: 'commonResources')
    
}

pluginManager.withPlugin('net.neoforged.moddev.legacyforge') {
    dependencies {
        // Forge 1.20.1 runs on SRG names; the mixin annotation processor writes each module's refmap
        annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
        // MixinExtras is provided at runtime by Sable (and Veil), which bundle it
        implementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"

        // Runtime-only mods for the dev runs
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") { transitive = false }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Static mixin audit against the real 1.20.1 target classes (scripts/mixin-check/MixinChecker.java, shared with
// Sable's port): ./gradlew checkMixins
sourceSets {
    mixinCheck {
        java.srcDir rootProject.file('scripts/mixin-check')
    }
}

dependencies {
    mixinCheckImplementation 'org.ow2.asm:asm-tree:9.7'
    mixinCheckImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.register('checkMixins', JavaExec) {
    group = 'verification'
    description = 'Checks every mixin target, injector signature and @At target against the classes on the compile classpath'
    dependsOn 'classes', 'mixinCheckClasses'
    classpath = sourceSets.mixinCheck.runtimeClasspath + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'MixinChecker'
    def resources = layout.buildDirectory.dir('resources/main')
    argumentProviders.add({
        (resources.get().asFile.listFiles()?.findAll { it.name.endsWith('mixins.json') } ?: []).collect { it.path }
    } as CommandLineArgumentProvider)
}

// The same audit against what production loads: the reobfuscated jar and its refmap, checked against SRG-named
// Minecraft and the original (SRG) mod jars. This catches mixins that only resolve against dev names, such as a
// remap = false injector whose target is a mod class's override of a Minecraft method. Needs a Forge client install:
//   java -jar forge-1.20.1-<forge_version>-installer.jar --installClient <dir>   (an empty launcher_profiles.json is enough)
//   ./gradlew checkMixinsProduction -PforgeClientInstall=<dir>
pluginManager.withPlugin('net.neoforged.moddev.legacyforge') {
    // Aeronautics and Offroad mix into Simulated, so their checks also need Simulated's reobfuscated jar
    def dependencyJars = project.path == ':simulated:neoforge' ? [] : [':simulated:neoforge']

    // Resolved lazily: the plugin adds reobfJar after this block runs
    def jarFile = { tasks.named('reobfJar').get().archiveFile.get().asFile }
    def devClasspath = sourceSets.main.compileClasspath

    // SRG-named Minecraft, the original (SRG) mod jars and the other libraries, as the production game sees them
    def productionClasspath = {
        if (!project.hasProperty('forgeClientInstall')) {
            throw new GradleException('Pass -PforgeClientInstall=<dir of a Forge client install>')
        }
        def install = file(project.property('forgeClientInstall'))
        def libraries = new File(install, 'libraries')
        def srgMinecraft = [
                "net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-client.jar",
                "net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-universal.jar",
        ].collect { new File(libraries, it) }
        srgMinecraft += fileTree(new File(libraries, 'net/minecraft/client')).matching { include '**/*-srg.jar' }.files
        srgMinecraft.each { if (!it.exists()) throw new GradleException("Missing $it") }

        // ModDevGradle only puts dev-remapped copies of mods on the classpath; use the originals from the caches
        def modulesCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
        def originals = [:]
        def libs = []
        devClasspath.files.each { f ->
            if (f.path.contains('/transforms/')) {
                originals[f.name] = null
            } else if (!f.path.contains('/moddev/') && !f.path.startsWith(rootDir.path)) {
                libs << f
            }
        }
        def mavenLocalDir = new File(System.getProperty('user.home'), '.m2/repository')
        [modulesCache, mavenLocalDir].findAll { it.exists() }.each { dir ->
            fileTree(dir).matching { originals.keySet().each { name -> include "**/$name" } }.files.each { originals[it.name] = it }
        }
        originals.each { name, f -> if (f == null) throw new GradleException("No original jar for $name in $modulesCache or $mavenLocalDir") }

        def projectJars = dependencyJars.collect { project(it).tasks.named('reobfJar').get().archiveFile.get().asFile }
        def checker = sourceSets.mixinCheck.runtimeClasspath.files.findAll { !it.path.contains('/moddev/') && !it.path.contains('/transforms/') && !it.path.startsWith(rootDir.path) || it.path.contains('mixinCheck') }
        return [checker, jarFile(), projectJars, srgMinecraft, originals.values(), libs]
    }

    tasks.register('checkMixinsProduction', JavaExec) {
        group = 'verification'
        description = 'Checks the reobfuscated mixins and refmap against SRG-named Minecraft and mod jars'
        dependsOn 'reobfJar', 'mixinCheckClasses'
        dependencyJars.each { dependsOn("$it:reobfJar") }
        def refmapFile = layout.buildDirectory.file("tmp/checkMixinsProduction/${mod_id}.refmap.json")
        def resources = layout.buildDirectory.dir('resources/main')
        mainClass = 'MixinChecker'
        doFirst {
            classpath = files(productionClasspath())

            def refmap = refmapFile.get().asFile
            refmap.parentFile.mkdirs()
            refmap.bytes = zipTree(jarFile()).matching { include "${mod_id}.refmap.json" }.singleFile.bytes
            args = ['--refmap', refmap.path] + (resources.get().asFile.listFiles()?.findAll { it.name.endsWith('mixins.json') } ?: []).collect { it.path }
        }
    }

    // Finds classes whose interface methods only resolve with dev names, e.g. an interface declaring Level getLevel()
    // on a block entity, which throws AbstractMethodError in production. -PalsoCheck=<jar>[,<jar>] checks other jars too.
    tasks.register('checkAbstractMethodsProduction', JavaExec) {
        group = 'verification'
        description = 'Checks that every interface method of the reobfuscated classes is implemented against SRG-named Minecraft'
        dependsOn 'reobfJar', 'mixinCheckClasses'
        dependencyJars.each { dependsOn("$it:reobfJar") }
        mainClass = 'AbstractMethodChecker'
        doFirst {
            classpath = files(productionClasspath())
            def extra = project.hasProperty('alsoCheck') ? project.property('alsoCheck').toString().split(',').toList() : []
            args = [jarFile().path] + extra
        }
    }
}
