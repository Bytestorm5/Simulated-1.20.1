plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    def commonProjectPath = project.path.contains(':') ? ":${project.parent.name}:common" : ':common'
    
    compileOnly(project(commonProjectPath)) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: commonProjectPath, configuration: 'commonJava')
    commonResources project(path: commonProjectPath, configuration: 'commonResources')
    
}

pluginManager.withPlugin('net.neoforged.moddev.legacyforge') {
    dependencies {
        // Forge 1.20.1 runs on SRG names; the mixin annotation processor writes each module's refmap
        annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
        // MixinExtras is provided at runtime by Sable (and Veil), which bundle it
        implementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"

        // Runtime-only mods for the dev runs
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") { transitive = false }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Static mixin audit against the real 1.20.1 target classes (scripts/mixin-check/MixinChecker.java, shared with
// Sable's port): ./gradlew checkMixins
sourceSets {
    mixinCheck {
        java.srcDir rootProject.file('scripts/mixin-check')
    }
}

dependencies {
    mixinCheckImplementation 'org.ow2.asm:asm-tree:9.7'
}

tasks.register('checkMixins', JavaExec) {
    group = 'verification'
    description = 'Checks every mixin target, injector signature and @At target against the classes on the compile classpath'
    dependsOn 'classes', 'mixinCheckClasses'
    classpath = sourceSets.mixinCheck.runtimeClasspath + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'MixinChecker'
    def resources = layout.buildDirectory.dir('resources/main')
    argumentProviders.add({
        (resources.get().asFile.listFiles()?.findAll { it.name.endsWith('mixins.json') } ?: []).collect { it.path }
    } as CommandLineArgumentProvider)
}
