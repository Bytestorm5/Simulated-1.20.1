plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

def generatedResources = project(":offroad:common").file("src/generated/resources")
def commonResources = project(":offroad:common").file("src/main/resources")

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    // Automatically enable AccessTransformers if the file exists
    def at = project(':offroad:common').file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('forge.enabledGameTestNamespaces', mod_id)
            ideName = "Offroad Forge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        data {
            data()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--all',
                    '--mod', 'offroad',
                    '--output', generatedResources.absolutePath,
                    '--existing', commonResources.absolutePath,
                    '--existing-mod', 'create',
                    '--existing-mod', 'simulated'
        }
    }
    
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        simulated {
            sourceSet project(':simulated:neoforge').sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir generatedResources.absolutePath
}

// Forge 1.20.1 runs on SRG names, so every mixin config needs a refmap. The common sources are compiled in this
// project, so one refmap covers both configs.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "offroad.mixins.json"
    config "offroad.neoforge.mixins.json"
}

// Forge 1.20.1 only loads mixin configs listed in the jar manifest
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': "offroad.mixins.json,offroad.neoforge.mixins.json")
}
